name: dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: raakmillegem
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-onbekend}
        GIT_SHA: ${GIT_SHA:-onbekend}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/raakmillegem
      SECRET_KEY: ${SECRET_KEY:-change-me}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # STT/Voxtral (#282) — backend leest dit als runtime-env; default browser_only
      # houdt de WS-route dark. Zet STT_MODE=native_first in .env.dev om Voxtral te activeren.
      STT_MODE: ${STT_MODE:-browser_only}
      STT_PROVIDER: ${STT_PROVIDER:-voxtral}
      STT_MODEL: ${STT_MODEL:-voxtral-mini-transcribe-realtime-2602}
      STT_BASE_URL: ${STT_BASE_URL:-wss://api.mistral.ai}
      STT_SAMPLE_RATE: ${STT_SAMPLE_RATE:-16000}
      STT_LANGUAGE: ${STT_LANGUAGE:-nl}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-auto}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_MAX_INPUT_CHARS: ${CHAT_MAX_INPUT_CHARS:-2000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-}
      PAYMENT_BENEFICIARY: ${PAYMENT_BENEFICIARY:-}
      # #1023: dev gaf dit als enige omgeving niet door, terwijl hdev, uat en prod
      # dat wel doen. Zonder gevolg zolang niemand lokaal met meerdere afdelingen
      # of een platformhost werkt — en dat is precies waarom het onopgemerkt bleef.
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
      # Hier stond een gat, en het was het derde van zijn soort (#798, #821, nu
      # #917). Deze variabelen staan met uitleg in `.env.<omgeving>.example` — dus
      # gedocumenteerd als iets dat je per omgeving zet — maar werden nergens
      # doorgegeven. Wie ze op de host invulde, kreeg stilzwijgend de default: de
      # kill-switch van de backoffice-assistent stond vast in de uit-stand, en het
      # lidgeld uit `.env.prod` bereikte de applicatie nooit.
      #
      # `${VAR:-}` en niet `${VAR:-<default>}`: die tweede vorm zet dezelfde default
      # in vier compose-bestanden náást config.py, en dat is de vorm die uit elkaar
      # loopt. Een lege waarde betekent hier "niet gezet" — één regel in
      # `Settings._leeg_is_niet_gezet` maakt dat waar.
      # Raakje, publiek en backoffice (#205, #917). Allemaal optioneel: een lege
      # waarde betekent 'niet gezet' en valt terug op de default in config.py.
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_MAX_HISTORY_MESSAGES: ${CHAT_MAX_HISTORY_MESSAGES:-}
      CHAT_DAILY_CHAR_BUDGET: ${CHAT_DAILY_CHAR_BUDGET:-}
      CHAT_MAX_TOOL_ROUNDS: ${CHAT_MAX_TOOL_ROUNDS:-}
      ADMIN_CHAT_ENABLED: ${ADMIN_CHAT_ENABLED:-}
      ADMIN_CHAT_MODEL: ${ADMIN_CHAT_MODEL:-}
      ADMIN_CHAT_DAILY_CHAR_BUDGET: ${ADMIN_CHAT_DAILY_CHAR_BUDGET:-}
      ADMIN_CHAT_MAX_TOOL_ROUNDS: ${ADMIN_CHAT_MAX_TOOL_ROUNDS:-}
      # Design Studio (#1007): AI illustrations via Black Forest Labs. Empty =
      # not set; the defaults live in config.py, never here.
      BFL_API_KEY: ${BFL_API_KEY:-}
      DESIGNSTUDIO_AI_IMAGES_ENABLED: ${DESIGNSTUDIO_AI_IMAGES_ENABLED:-}
      DESIGNSTUDIO_AI_MONTHLY_BUDGET_EUR: ${DESIGNSTUDIO_AI_MONTHLY_BUDGET_EUR:-}
      DESIGNSTUDIO_AI_PLATFORM_BUDGET_EUR: ${DESIGNSTUDIO_AI_PLATFORM_BUDGET_EUR:-}
      BFL_USD_EUR_RATE: ${BFL_USD_EUR_RATE:-}
      # #1212: the price of one OCR page in USD; the default lives in config.py.
      OCR_PRICE_PER_PAGE_USD: ${OCR_PRICE_PER_PAGE_USD:-}
      ADMIN_CHAT_MAX_ROWS: ${ADMIN_CHAT_MAX_ROWS:-}
      ADMIN_CHAT_TIMEOUT_SECONDS: ${ADMIN_CHAT_TIMEOUT_SECONDS:-}
      # Lidgeld en inschrijflimieten. Per tenant instelbaar in het beheerscherm;
      # deze waarden zijn de terugval daaronder.
      MEMBERSHIP_PRICE_FULL: ${MEMBERSHIP_PRICE_FULL:-}
      MEMBERSHIP_PRICE_HALF: ${MEMBERSHIP_PRICE_HALF:-}
      MEMBERSHIP_HALF_PRICE_START_MD: ${MEMBERSHIP_HALF_PRICE_START_MD:-}
      MEMBERSHIP_HALF_PRICE_END_MD: ${MEMBERSHIP_HALF_PRICE_END_MD:-}
      MEMBERSHIP_NEXT_YEAR_FROM_MD: ${MEMBERSHIP_NEXT_YEAR_FROM_MD:-}
      MAX_ITEM_QUANTITY: ${MAX_ITEM_QUANTITY:-}
      MAX_REGISTRATIONS_PER_EMAIL: ${MAX_REGISTRATIONS_PER_EMAIL:-}
      # Onderhoud en diagnose.
      EMAIL_LOG_RETENTION_DAYS: ${EMAIL_LOG_RETENTION_DAYS:-}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-}
      SQL_ECHO: ${SQL_ECHO:-}
      # Alleen hier nog niet doorgegeven.
      MEMBERSHIP_RENEWAL_START_MD: ${MEMBERSHIP_RENEWAL_START_MD:-}
      PAYMENT_TERM_DAYS: ${PAYMENT_TERM_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal


  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:z
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_dev_data:
  caddy_dev_data:
  caddy_dev_config:

networks:
  internal:
