[pytest]
# The tests live in three places (CR-13 R15): a domain's own in app/domains/<x>/tests/,
# flows through several domains in tests/integration/, kernel, ui and gates in tests/.
testpaths = tests app/domains
filterwarnings =
    ignore::DeprecationWarning
# Markers (#622): zou de UI ooit weer een SPA worden, dan moet in één oogopslag
# duidelijk zijn wat meeverhuist en wat weggegooid wordt. Dat is een keuze die je nú
# maakt, niet achteraf uitzoekt.
#
#   pytest -m ui_serverrendered --collect-only -q   # dit is de lijst
#   pytest -m "not ui_serverrendered"               # dit blijft sowieso groen
#
# Markers and folders cut differently: the folders sort by domain (CR-13 R15), the
# markers by how a test depends on the UI.
markers =
    ui_serverrendered: hangt aan Jinja/htmx-rendering — herschrijven bij een UI-wissel
    ui_agnostisch: domein-, geld- of contract-test — overleeft elke UI
