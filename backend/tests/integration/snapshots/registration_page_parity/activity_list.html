<main id="main" class="site-container py-8" :inert="menu" data-main>
<div data-page-header class="flex flex-wrap gap-x-3 gap-y-2 mb-6 items-end">
<div data-title-block class="block min-w-0 max-w-full flex-[1_0_auto]">
<h1 tabindex="-1" class="text-3xl font-bold text-kop truncate">Activiteiten</h1>
</div>
<div data-header-actions class="flex md:flex-wrap md:justify-end md:items-center md:gap-2 md:ml-auto flex-wrap justify-end items-center gap-2 ml-auto">
<a class="text-base md:text-sm text-blue-700 hover:underline" href="/activiteiten/archief">Archief →</a>
</div>
</div>
<div class="space-y-6">
<h3 data-year-heading class="text-xl md:text-lg font-semibold text-kop border-b border-line pb-1">2099</h3>
<div id="act-<ACTIVITY>" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 scroll-mt-24">
<div class="flex gap-3 sm:gap-4">
<div data-date-tile class="shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-blue-50 text-blue-700 flex flex-col items-center justify-center" aria-hidden="true">
<span class="text-xl font-bold leading-none">01</span>
<span class="text-xs font-semibold uppercase leading-none mt-0.5">jun</span>
</div>
<div class="min-w-0 flex-1">
<div>
<h2 data-card-title class="text-xl md:text-lg font-semibold flex flex-wrap items-center gap-2">
<a href="/activiteiten/<ACTIVITY>" class="text-blue-700 hover:underline">Karakterisering</a>
</h2>
<div data-activity-dates class="text-base md:text-sm text-ink-soft flex items-start gap-1">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-block shrink-0 mt-1 md:mt-0.5 shrink-0" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
<div class="flex flex-col">
<span>maandag 1 juni 2099</span>
</div>
</div>
</div>
<div data-component-actions class="mt-3 space-y-3 -ml-[60px] sm:ml-0">
<div class="pt-2" x-data="{ open: false }">
<div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
<span class="text-base md:text-sm font-semibold text-ink sm:mr-1">Ploegen</span>
<div class="flex flex-wrap gap-2 items-center">
<a class="inline-flex items-center justify-center gap-1.5 font-semibold rounded-lg transition-colors bg-blue-700 hover:bg-brand-ocean-hover text-white border border-transparent px-3 py-1.5 text-sm min-h-11 md:px-2.5 md:py-1 md:text-xs md:min-h-0" href="/activiteiten/<ACTIVITY>/inschrijven/<C:team>">Inschrijven</a>
<button type="button" class="inline-flex items-center justify-center gap-1.5 font-semibold rounded-lg transition-colors bg-white border border-blue-600 text-blue-700 hover:bg-blue-50 px-3 py-1.5 text-sm min-h-11 md:px-2.5 md:py-1 md:text-xs md:min-h-0" @click="open = !open"
 hx-get="/activiteiten/<ACTIVITY>/deelnemers/<C:team>"
 hx-target="#deelnemers-<ACTIVITY>-<C:team>" hx-trigger="click once">
<span x-show="!open">Wie doet er mee?</span><span x-show="open" x-cloak>Verberg</span>
</button>
</div>
</div>
<div id="deelnemers-<ACTIVITY>-<C:team>" x-show="open" x-cloak style="display: none"></div>
</div>
<div class="pt-2" x-data="{ open: false }">
<div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
<span class="text-base md:text-sm font-semibold text-ink sm:mr-1">Los</span>
<div class="flex flex-wrap gap-2 items-center">
<a class="inline-flex items-center justify-center gap-1.5 font-semibold rounded-lg transition-colors bg-blue-700 hover:bg-brand-ocean-hover text-white border border-transparent px-3 py-1.5 text-sm min-h-11 md:px-2.5 md:py-1 md:text-xs md:min-h-0" href="/activiteiten/<ACTIVITY>/inschrijven/<C:plain>">Inschrijven</a>
<button type="button" class="inline-flex items-center justify-center gap-1.5 font-semibold rounded-lg transition-colors bg-white border border-blue-600 text-blue-700 hover:bg-blue-50 px-3 py-1.5 text-sm min-h-11 md:px-2.5 md:py-1 md:text-xs md:min-h-0" @click="open = !open"
 hx-get="/activiteiten/<ACTIVITY>/deelnemers/<C:plain>"
 hx-target="#deelnemers-<ACTIVITY>-<C:plain>" hx-trigger="click once">
<span x-show="!open">Wie doet er mee?</span><span x-show="open" x-cloak>Verberg</span>
</button>
</div>
</div>
<div id="deelnemers-<ACTIVITY>-<C:plain>" x-show="open" x-cloak style="display: none"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
