<section data-form-section class="form-section bg-surface border border-line rounded-2xl shadow-sm p-4">
<h2 class="text-base font-semibold leading-6 text-ink mb-4">Contact</h2>
<div data-form-grid class="form-grid">
<p class="rounded-md bg-blue-50 px-3 py-2 text-sm leading-[21px] text-ink" data-member-nudge data-span="full">Lid van RAAK?
 <a class="text-link underline" href="/aanmelden?terug=/activiteiten/<ACTIVITY>/inschrijven/<C:team>">Log je eerst aan</a>: dan staat de inschrijving bij je gezin.</p>
<div data-field="contact_name" data-kind="text" data-span="half" class="min-w-0">
<label for="contact_name" class="block text-sm font-medium leading-[21px] text-ink mb-1">Naam <span class="text-red-600">*</span></label>
<input type="text"
 class="block w-full min-w-0 h-11 md:h-10 rounded-md border bg-surface px-3 text-sm text-ink placeholder:text-ink-soft focus:outline-none focus-visible:ring-[3px] focus-visible:ring-focus disabled:bg-surface-2 disabled:text-ink-soft disabled:cursor-not-allowed border-control-line" id="contact_name" name="contact_name" required autocomplete="name">
</div>
<div data-field="contact_email" data-kind="email" data-span="full" class="min-w-0">
<label for="contact_email" class="block text-sm font-medium leading-[21px] text-ink mb-1">E-mailadres <span class="text-red-600">*</span></label>
<input type="email"
 class="block w-full min-w-0 h-11 md:h-10 rounded-md border bg-surface px-3 text-sm text-ink placeholder:text-ink-soft focus:outline-none focus-visible:ring-[3px] focus-visible:ring-focus disabled:bg-surface-2 disabled:text-ink-soft disabled:cursor-not-allowed border-control-line" id="contact_email" name="contact_email" required autocomplete="email">
</div>
<div data-field="phone" data-kind="phone" data-span="half" class="min-w-0">
<label for="phone" class="block text-sm font-medium leading-[21px] text-ink mb-1">Mobiel nummer <span class="text-red-600">*</span></label>
<input type="tel"
 class="block w-full min-w-0 h-11 md:h-10 rounded-md border bg-surface px-3 text-sm text-ink placeholder:text-ink-soft focus:outline-none focus-visible:ring-[3px] focus-visible:ring-focus disabled:bg-surface-2 disabled:text-ink-soft disabled:cursor-not-allowed border-control-line" id="phone" name="phone" required autocomplete="tel">
</div>
<div data-field="team_name" data-kind="text" data-span="half" class="min-w-0">
<label for="team_name" class="block text-sm font-medium leading-[21px] text-ink mb-1">Ploegnaam <span class="text-red-600">*</span></label>
<input type="text"
 class="block w-full min-w-0 h-11 md:h-10 rounded-md border bg-surface px-3 text-sm text-ink placeholder:text-ink-soft focus:outline-none focus-visible:ring-[3px] focus-visible:ring-focus disabled:bg-surface-2 disabled:text-ink-soft disabled:cursor-not-allowed border-control-line" id="team_name" name="team_name" required >
</div>
</div>
</section>
<section data-form-section class="form-section bg-surface border border-line rounded-2xl shadow-sm p-4">
<h2 class="text-base font-semibold leading-6 text-ink mb-4">Je deelname</h2>
<div data-form-grid class="form-grid">
<div data-field="products" data-span="full" class="min-w-0">
<div id="prijsblok-<C:team>" class="grid gap-3">
<div class="space-y-2">
<div class="flex items-center justify-between gap-x-3" data-product-row>
<div class="text-sm">
<span class="font-medium">Product paid</span>
<span class="ml-2 text-gray-500">€12,50</span>
</div>
<div class="inline-flex shrink-0 items-stretch rounded-xl border border-gray-300 overflow-hidden bg-white"
 x-data="{ stap(richting) {
 const veld = $refs.veld;
 const nu = Number(veld.value) || 0;
 const grens = Number(richting < 0 ? veld.min : veld.max);
 const nieuw = richting < 0 ? Math.max(grens, nu + richting)
 : Math.min(grens, nu + richting);
 if (nieuw === nu) return;
 veld.value = nieuw;
 veld.dispatchEvent(new Event('change', { bubbles: true }));
 } }">
<button type="button" @click="stap(-1)"
 aria-label="Eén minder — Product paid"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">&minus;</button>
<input type="number" name="product_<P:paid>" id="product-<P:paid>" x-ref="veld" value="0"
 min="0" max="99" inputmode="numeric"class="teller-veld h-11 w-14 shrink-0 text-center border-0 focus:outline-none focus:ring-2 focus:ring-blue-500"
 hx-post="/activiteiten/<ACTIVITY>/inschrijven/<C:team>/totaal" hx-include="closest form" hx-target="#totaal-<C:team>" hx-swap="innerHTML transition:false" hx-trigger="change, keyup delay:300ms">
<button type="button" @click="stap(1)"
 aria-label="Eén meer — Product paid"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">+</button>
</div>
</div>
<div class="flex items-center justify-between gap-x-3" data-product-row>
<div class="text-sm">
<span class="font-medium">Product free</span>
<span class="ml-2 text-gray-500">gratis</span>
</div>
<div class="inline-flex shrink-0 items-stretch rounded-xl border border-gray-300 overflow-hidden bg-white"
 x-data="{ stap(richting) {
 const veld = $refs.veld;
 const nu = Number(veld.value) || 0;
 const grens = Number(richting < 0 ? veld.min : veld.max);
 const nieuw = richting < 0 ? Math.max(grens, nu + richting)
 : Math.min(grens, nu + richting);
 if (nieuw === nu) return;
 veld.value = nieuw;
 veld.dispatchEvent(new Event('change', { bubbles: true }));
 } }">
<button type="button" @click="stap(-1)"
 aria-label="Eén minder — Product free"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">&minus;</button>
<input type="number" name="product_<P:free>" id="product-<P:free>" x-ref="veld" value="0"
 min="0" max="99" inputmode="numeric"class="teller-veld h-11 w-14 shrink-0 text-center border-0 focus:outline-none focus:ring-2 focus:ring-blue-500"
 hx-post="/activiteiten/<ACTIVITY>/inschrijven/<C:team>/totaal" hx-include="closest form" hx-target="#totaal-<C:team>" hx-swap="innerHTML transition:false" hx-trigger="change, keyup delay:300ms">
<button type="button" @click="stap(1)"
 aria-label="Eén meer — Product free"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">+</button>
</div>
</div>
<div class="flex items-center justify-between gap-x-3" data-product-row>
<div class="text-sm">
<span class="font-medium">Product on_site</span>
<span class="ml-2 text-gray-500">ter plaatse te betalen (eigen budget)</span>
</div>
<div class="inline-flex shrink-0 items-stretch rounded-xl border border-gray-300 overflow-hidden bg-white"
 x-data="{ stap(richting) {
 const veld = $refs.veld;
 const nu = Number(veld.value) || 0;
 const grens = Number(richting < 0 ? veld.min : veld.max);
 const nieuw = richting < 0 ? Math.max(grens, nu + richting)
 : Math.min(grens, nu + richting);
 if (nieuw === nu) return;
 veld.value = nieuw;
 veld.dispatchEvent(new Event('change', { bubbles: true }));
 } }">
<button type="button" @click="stap(-1)"
 aria-label="Eén minder — Product on_site"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">&minus;</button>
<input type="number" name="product_<P:on_site>" id="product-<P:on_site>" x-ref="veld" value="0"
 min="0" max="99" inputmode="numeric"class="teller-veld h-11 w-14 shrink-0 text-center border-0 focus:outline-none focus:ring-2 focus:ring-blue-500"
 hx-post="/activiteiten/<ACTIVITY>/inschrijven/<C:team>/totaal" hx-include="closest form" hx-target="#totaal-<C:team>" hx-swap="innerHTML transition:false" hx-trigger="change, keyup delay:300ms">
<button type="button" @click="stap(1)"
 aria-label="Eén meer — Product on_site"
 class="h-11 w-11 shrink-0 text-lg leading-none text-ink-soft hover:bg-gray-100">+</button>
</div>
</div>
</div>
<div id="totaal-<C:team>">
<div data-total x-data x-init="if (typeof betalen !== 'undefined') betalen = false" class="border-t border-line pt-3 text-sm font-semibold text-ink-soft">
 Totaal: €0,00
</div>
</div>
</div>
</div>
<p data-span="full" class="text-sm"><a class="text-link underline" href="/activiteiten/<ACTIVITY>?deelnemers=<C:team>">Wie doet er mee?</a></p>
<div data-field="remarks" data-kind="textarea" data-span="full" class="min-w-0">
<label for="remarks" class="block text-sm font-medium leading-[21px] text-ink mb-1">Opmerkingen</label>
<textarea name="remarks" id="remarks" rows="2" placeholder="Eventuele boodschap voor de organisatie…"
 class="block w-full min-w-0 rounded-md border border-control-line bg-surface px-3 py-2 text-sm text-ink placeholder:text-ink-soft focus:outline-none focus-visible:ring-[3px] focus-visible:ring-focus"
 x-data="{ bodem: 0,
 init() { this.groei(); if (this.bodem) return;
 const vak = this.$el, zelf = this;
 const ro = new ResizeObserver(function () {
 if (vak.offsetHeight) { ro.disconnect(); zelf.groei(); } });
 ro.observe(vak); },
 meet() { this.$el.style.height = ``; this.bodem = this.$el.offsetHeight; },
 groei() { if (!this.bodem) this.meet(); if (!this.bodem) return;
 this.$el.style.height = `auto`;
 const rand = this.$el.offsetHeight - this.$el.clientHeight;
 this.$el.style.height = Math.min(Math.max(this.$el.scrollHeight + rand, this.bodem), 400) + `px`; } }"
 x-on:input="groei()" ></textarea>
</div>
</div>
</section>
<section data-form-section class="form-section bg-surface border border-line rounded-2xl shadow-sm p-4">
<h2 class="text-base font-semibold leading-6 text-ink mb-4">Betalen</h2>
<div data-form-grid class="form-grid">
<div data-field="payment_method" data-kind="radio_group" data-span="full" class="min-w-0">
<p id="payment_method-label" class="text-sm font-medium leading-[21px] text-ink mb-1">Betaalwijze <span class="text-red-600">*</span></p>
<div role="radiogroup" aria-labelledby="payment_method-label" class="grid gap-1">
<label class="flex items-start gap-2 min-h-11 md:min-h-10 py-2 text-sm cursor-pointer">
<input type="radio" name="payment_method" value="online" class="mt-0.5 h-[18px] w-[18px] shrink-0" checked>
<span><span class="font-medium text-ink">Online betalen</span><span class="block text-[13px] text-ink-soft">Na het verzenden ga je naar de beveiligde betaalpagina.</span></span>
</label>
<label class="flex items-start gap-2 min-h-11 md:min-h-10 py-2 text-sm cursor-pointer">
<input type="radio" name="payment_method" value="transfer" class="mt-0.5 h-[18px] w-[18px] shrink-0">
<span><span class="font-medium text-ink">Overschrijving</span><span class="block text-[13px] text-ink-soft">De betaalgegevens staan in de bevestiging.</span></span>
</label>
</div>
</div>
</div>
</section>
