{% if status == "linked" %}
<p data-koppeling class="text-sm text-ink">{{ _("Deze bestelling wordt gekoppeld aan een bestaand lid.") }}</p>
{% elif status == "multiple" %}
<p data-koppeling class="text-sm text-red-700">{{ _("Dit adres hoort bij meerdere personen; vraag een ander adres.") }}</p>
{% elif email and "@" in email %}
<p data-koppeling class="text-sm text-red-700">{{ _("Dit e-mailadres is bij niemand gekend.") }}</p>
{% endif %}
