[tool.mypy]
python_version = "3.12"
files = ["app"]
# Pydantic-plugin: laat mypy de modellen/settings begrijpen (o.a. dat
# `Settings()` zijn velden uit de omgeving leest) i.p.v. een ontbrekend-argument
# te melden.
plugins = ["pydantic.mypy"]
# Bibliotheken zonder type-stubs (externe SDK's) mogen de check niet blokkeren —
# we typen onze eigen code, niet die van derden.
ignore_missing_imports = true
# Zinvolle, niet-overdreven strikte set. Geen volledige --strict: dat zou een
# berg ruis geven op de bestaande ORM-stijl zonder evenredige winst.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# De ORM-modellen gebruiken nog de oude `Column(...)`-stijl (niet `Mapped[...]`).
# Daardoor ziet mypy attributen als `Column[str]` i.p.v. `str` → een berg valse
# positieven. Tot een eventuele migratie naar `Mapped[...]` (apart issue)
# behandelen we de SQLAlchemy-laag als untyped; mypy checkt zo wél onze eigen
# logica (None-dereferences, verkeerde argument-types) zonder ORM-ruis.
[[tool.mypy.overrides]]
module = "sqlalchemy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

# CR-12 fase 1 (§B4.8, §F10): mypy strikt per gemigreerd domein, als BONUS en
# niet als poort. De poort op losse stringvergelijkingen is een AST-wandeling
# (`tests/test_codes_gate.py`), want met de oude `Column()`-stijl typeert mypy
# elk kolomattribuut als `Any` en is `Any == "paid"` nooit een fout.
#
# Waar een kolom wél als `Mapped[Enum] = mapped_column(EnumColumn(...))`
# geschreven is, ziet mypy het type zonder plugin, en dan is `strict_equality`
# een tweede net dat gratis meekomt. Per domein aanzetten zodra het gemigreerd
# is; niet `--strict` globaal, want dat vraagt een uitzonderingslijst en daar
# sterft een regel (#760).
# `warn_return_any` staat hier bewust NIET bij, en dat is een meting en geen
# smaak: met hem aan meldt mypy achttien keer "Returning Any" op
# `db.query(...).first()`. Die `Any` komt uit de sqlalchemy-override bovenaan
# dit bestand (`follow_imports = "skip"`), dus het rapporteert de typering van
# de ORM en niet die van ons. Ruis die de twee echte bevindingen verbergt is
# erger dan geen controle — zet hem aan wanneer de ORM-laag wél getypeerd is.
# CR-12 phase 5 (#1182): every domain that owns a code list, plus the kernel
# lists and `membership`, which reads `mdm`'s relation type the most. One
# override for all of them rather than one per domain: the rule is the same
# everywhere, and a list of seventeen copies is how one falls behind.
#
# **What it catches, measured on 27 September 2026 — and what it does not.**
# Switched on, it found eight comparisons between a parameter typed `str` and
# an enum member (`set_attendance`, `_subtitle_for`, `recipients_for`). All
# eight were wrong annotations: every caller already passed a member, so none
# was a live bug, but each would have become one the day a caller passed the
# code. It does NOT catch `meeting.status == "sent"` on a column, even one
# written `Mapped[MeetingStatus]`: tried, and mypy stayed silent. The
# `follow_imports = "skip"` on `sqlalchemy.*` above makes `Mapped` itself
# `Any`. So on columns the AST gate (`test_codes_gate.py`) stays the net, and
# this override is the bonus the change request promised, for typed code.
[[tool.mypy.overrides]]
module = [
    "app.domains.activities.*", "app.domains.auth.*", "app.domains.chatbot.*",
    "app.domains.designstudio.*", "app.domains.forms.*", "app.domains.mail.*",
    "app.domains.mdm.*", "app.domains.media.*", "app.domains.meetings.*",
    "app.domains.membership.*", "app.domains.newsletter.*",
    "app.domains.payment.*", "app.domains.reporting.*", "app.domains.workflow.*",
    "app.kernel.jobs", "app.kernel.operations",
]
strict_equality = true
