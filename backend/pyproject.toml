# hook, `--stdin-filename`), not only when ruff walks a directory.
force-exclude = true

[tool.ruff.lint]
# The default set plus import order (#781). Deliberately NOT `N` (naming is the
# #780 ratchet; N818 would hit the `*Fout` classes) and NOT `B008` (FastAPI's
# `Depends()` in a default argument is the pattern, not a mistake).
select = ["E4", "E7", "E9", "F", "I"]
# E712 (`== True`): in a SQLAlchemy filter `Model.active == True` is a column
# comparison that builds `active = true`, and the "fix" `is True` breaks the
# query. `.is_(True)` is not the same either: `IS true` and `= true` differ on
# NULL outside a WHERE, and that is no question for a formatting commit (#781).
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "tests_e2e"]
# `backend/alembic/` is our migrations folder, not the alembic package; without
# this, ruff files `from alembic import op` under first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# The test settings (DATABASE_URL, SECRET_KEY, APP_ENV) must be in the
# environment BEFORE any app module is imported: app.database reads them at
# import time. So conftest sets os.environ first and imports after.
"tests/conftest.py" = ["E402"]
# Pytest fixtures imported from another test module and requested by name as a
# parameter: ruff reads each parameter as a redefinition of the import (F811).
"tests/integration/test_codes_phase3.py" = ["F811"]

[tool.coverage.run]
# A domain's tests live inside its package (CR-13 R15). `--cov=app` measures the app;
# counting the tests as covered code would raise the percentage without a line of app
# code being tested more.
omit = ["app/domains/*/tests/*"]
