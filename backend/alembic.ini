[alembic]
script_location = alembic
prepend_sys_path = .
# #951: `alembic revision` draait `env.py` NIET tenzij dit aanstaat — en dan
# wordt `process_revision_directives` nooit aangeroepen en krijgt een nieuwe
# migratie gewoon de standaard-uuid als id. De hook stond er, de test stond
# groen, en toch kwam er `283f93eac489_...py` uit: de functie werkte, maar niemand
# riep haar aan. Precies de vorm waar deze week twee keer op gestruikeld is.
revision_environment = true
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/raakmillegem

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
