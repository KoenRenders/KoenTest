name: CI

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
    branches: ["master"]

jobs:
  # Formatter and linter (#781). A job of its own: it needs no database and no
  # Inkscape, so a style finding is red within seconds instead of after the suite.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The version comes from requirements-dev.txt, so CI and a local run agree.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raaktest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Design Studio (#1007) renders posters through Inkscape as a subprocess;
      # the render tests call the real binary, as the image does. The poster
      # fonts come from app/static/fonts through the renderer's own fontconfig.
      - name: Install Inkscape
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends inkscape

      # Static type-check vangt None-dereferences en verkeerde argument-types vóór
      # de deploy — voorheen sneuvelden die pas op runtime (PROD). Symmetrie met
      # de frontend-job die `tsc --noEmit` draait.
      - name: Typecheck (mypy)
        run: python -m mypy

      - name: Run pytest (met coverage-rapport)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/raaktest
          SECRET_KEY: ci-test-secret-key-long-enough-for-hs256
          APP_ENV: dev
        # Drempel op 85 % (#680), tegen een werkelijke 88,65 %. Bewust niet gelijk
        # aan de huidige waarde: een drempel die op de meetwaarde ligt, valt om bij
        # elke tijdelijke dip tijdens een refactor, en een drempel die je telkens
        # wegduwt is erger dan geen drempel. Vier punten marge laat werk toe en zet
        # toch een echte rem op verval. Verhoog mee als de meting structureel stijgt.
        run: python -m pytest -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    # pip-audit blijft rapporterend tot er een ignore-lijst-mechanisme staat
    # (architectuurdoc §19.1) — dan blokkerend. npm audit verdween met de
    # frontend-container (React-exit #405): er is geen Node meer in de stack.
    #
    # RAPPORTEREND IS NIET STIL (#574). De job blijft groen — Koen beslist per
    # release of een bevinding moet wachten, een scanner dwingt dat niet af.
    # Maar hij mag niet geruisloos passeren: in #571 stond deze job groen met
    # 33 bekende kwetsbaarheden erachter, want een groen vinkje zegt "niets te
    # zien hier". Elke bevinding komt daarom als ::warning::-annotatie bovenaan
    # de runpagina én als tabel in de job-summary te staan.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend) — rapporterend, nooit stil
        working-directory: backend
        run: |
          # Actions draait bash met `set -e`, dus elke niet-nul exit stopt de
          # stap. Beide commando's vangen we daarom expliciet op: pip-audit
          # sluit af met 1 zodra er bevindingen zijn (dat is de normale gang van
          # zaken hier), en een mislukte install mag deze niet-blokkerende job
          # niet rood maken. Verbergen doen we niets — draait de scan niet, dan
          # ontbreekt audit.json en waarschuwt het rapport-script daarover.
          python -m pip install --quiet pip-audit || true
          pip-audit -r requirements.txt --format=json --output=audit.json || true
          python ../scripts/ci_audit_report.py audit.json

  e2e:
    runs-on: ubuntu-latest
    # BLOKKEREND sinds #395: de e2e-geldflow is de laatste verdediging vóór een
    # deploy; een rode e2e = geen merge.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raake2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raake2e
      SECRET_KEY: ci-e2e-secret-key-long-enough-for-hs256
      E2E_BASE_URL: http://localhost:8000
      # Everything that shapes the app under test comes from ONE file,
      # backend/tests_e2e/e2e.env, which scripts/e2e-local.sh reads too (#1296).
      # Only what differs by place stays here.

    steps:
      - uses: actions/checkout@v4

      # #1296: the one source of the e2e environment, for every step after this.
      - name: e2e environment (backend/tests_e2e/e2e.env)
        run: grep -Ev '^[[:space:]]*(#|$)' backend/tests_e2e/e2e.env >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # playwright-python vervangt de Node-Playwright (React-exit #405): de
      # golden flows draaien in een echte Chromium tegen de server-rendered site.
      - name: Backend-deps + Playwright-browser
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-e2e.txt
          playwright install --with-deps chromium

      - name: Migraties + seed postcodes
        working-directory: backend
        run: |
          alembic upgrade head
          python seed_postal_codes.py

      # Zonder data skipten de drie beheerflows en bewees de e2e-job niets over
      # de beheerschermen (#644). seed_e2e.py weigert te draaien buiten dev/test.
      - name: Seed e2e-data (gezin, activiteit, inschrijving, betalingen)
        working-directory: backend
        env:
          E2E_SEED: "1"
        run: python seed_e2e.py

      - name: Start backend
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &

      - name: Wachten tot de backend bereikbaar is
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 2
          done
          echo "Backend niet bereikbaar"; tail -50 /tmp/backend.log; exit 1

      - name: Run e2e (golden flows)
        working-directory: backend
        run: python -m pytest -v tests_e2e

      # #1605: the measurement baseline of the pilot screens — its own database
      # and its own server under a frozen clock (scripts/measure-run.sh says why).
      - name: Measurement baseline of the pilot screens (#1605)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raakmeet
        run: |
          sudo apt-get install -y -q faketime
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE raakmeet'
          scripts/measure-run.sh -v

      - name: Backend-log bij falen
        if: failure()
        run: tail -100 /tmp/backend.log

      - name: Measurement server log on failure
        if: failure()
        run: tail -100 /tmp/measure-uvicorn.log || true

  css:
    runs-on: ubuntu-latest
    # BLOKKEREND (#652): app.css wordt met de hand gegenereerd en meegecommit, en
    # liep stil uiteen met de templates — -mt-1/-mx-5 ontbraken, waardoor het
    # e-maillog op HDEV met verkeerde marges rendeerde zonder dat iets faalde.
    # Zelfde patroon als #450 ("boot kapot terwijl CI groen"): een handmatige stap
    # wordt vroeg of laat vergeten en de fout is pas zichtbaar als iemand toevallig
    # het juiste scherm opent. De build is reproduceerbaar (Tailwind gepind op
    # v3.4.17), dus een diff hier betekent altijd: niet herbouwd.

    steps:
      - uses: actions/checkout@v4

      - name: CSS herbouwen uit de templates
        run: ./scripts/build-css.sh

      - name: app.css moet gelijk lopen met de templates
        run: |
          if ! git diff --exit-code --stat backend/app/static/app.css; then
            echo ""
            echo "::error::app.css is niet herbouwd na een template-wijziging."
            echo "Draai lokaal:  ./scripts/build-css.sh"
            echo "en commit      backend/app/static/app.css  mee."
            git diff backend/app/static/app.css | head -40
            exit 1
          fi

  boot:
    runs-on: ubuntu-latest
    # BLOKKEREND (#450): draai de ECHTE startup.sh tegen een lege Postgres 16.
    # De backend crash-loopte ooit op HDEV terwijl CI groen was, omdat geen enkele
    # job de echte boot-sequence draaide. Dit dekt migraties + de seed-subprocessen
    # (postcodes, activiteiten, CMS-pagina's, sponsors) op een LEGE DB — die op een
    # bestaande DB niet lopen en dus door pytest/e2e ongetest bleven — plus uvicorn
    # + een health-probe. "Boot kapot terwijl CI groen" is zo structureel dicht.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raakboot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raakboot
      SECRET_KEY: ci-boot-secret-key-long-enough-for-hs256
      APP_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend-deps
        working-directory: backend
        run: pip install -r requirements.txt

      # The same import check the Docker build runs (#583). While it lived only
      # there, a removed or renamed module stayed invisible to CI and broke the
      # deploy build on the server instead — exactly what happened in #581. The
      # env is deliberately identical to backend/Dockerfile so CI covers the
      # same path.
      - name: Import check (identical to the Docker build)
        working-directory: backend
        env:
          APP_ENV: build
          SECRET_KEY: build-time-check
          DATABASE_URL: postgresql://x:x@localhost/x
        run: python check_imports.py

      - name: Echte boot via startup.sh (migraties + alle seeds + uvicorn) + health-probe
        working-directory: backend
        run: |
          # Via `sh` i.p.v. `./startup.sh`: de checkout draagt het exec-bit niet
          # (in Docker zet de image dat); functioneel identiek voor dit sh-script.
          sh startup.sh > /tmp/boot.log 2>&1 &
          BOOT_PID=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Boot OK — /api/health antwoordt (na poging $i)"; ok=1; break
            fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              echo "!! startup.sh is gestopt vóór health-OK"; break
            fi
            sleep 2
          done
          kill "$BOOT_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "=== boot.log ==="; cat /tmp/boot.log; exit 1
          fi

      - name: Boot-log tonen bij falen
        if: failure()
        run: cat /tmp/boot.log || true
