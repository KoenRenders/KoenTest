name: prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: raakmillegem
      POSTGRES_USER: ${DB_USER:?DB_USER ontbreekt in .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-onbekend}
        GIT_SHA: ${GIT_SHA:-onbekend}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER ontbreekt in .env.prod}:${DB_PASSWORD:?DB_PASSWORD ontbreekt in .env.prod}@db:5432/raakmillegem
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY ontbreekt in .env.prod}
      DEBUG: ${DEBUG:-false}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # STT/Voxtral (#282) — backend leest dit als runtime-env; default browser_only
      # houdt de WS-route dark. Zet STT_MODE=native_first in .env.prod om Voxtral te activeren.
      STT_MODE: ${STT_MODE:-browser_only}
      STT_PROVIDER: ${STT_PROVIDER:-voxtral}
      STT_MODEL: ${STT_MODEL:-voxtral-mini-transcribe-realtime-2602}
      STT_BASE_URL: ${STT_BASE_URL:-wss://api.mistral.ai}
      STT_SAMPLE_RATE: ${STT_SAMPLE_RATE:-16000}
      STT_LANGUAGE: ${STT_LANGUAGE:-nl}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-auto}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_MAX_INPUT_CHARS: ${CHAT_MAX_INPUT_CHARS:-2000}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL ontbreekt in .env.prod}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL ontbreekt in .env.prod}
      APP_ENV: prod
      # Rol-seeds voor de migraties (#798). Deze staan hier omdat de backend-service
      # GEEN `env_file:` heeft: elke variabele wordt expliciet doorgegeven, en wat
      # hier niet staat bereikt de container nooit — hoe netjes het ook in .env.prod
      # staat. Gemeten bij de upgrade-generale voor v2.0.0: migratie 087 las haar
      # placeholder, vond niemand met dat adres, en kende NUL gebruikers de rol
      # OPERATOR toe, terwijl het juiste adres wel degelijk in .env.uat stond en als
      # gebruiker bestond. Gevolg: /admin/tenants was voor niemand bereikbaar.
      # Multi-tenancy (#406/#821). These two belong here because the backend service
      # has NO `env_file:`: whatever is not in this block never reaches the container,
      # however neatly it sits in .env.prod. Measured on PROD: `PLATFORM_HOSTS=[]` and
      # `TENANT_HOSTNAMES=[]` in the running backend, while both were present in the
      # env file.
      #
      # The consequence was not just a missing landing page: `resolve_request` reads the
      # tenant cookie ONLY on a platform host. With an empty set that cookie was set and
      # never read, so anyone entering an afdeling through a path prefix and then
      # following an absolute path silently ended up on the default tenant — with a
      # registration form for the wrong afdeling.
      #
      # Third time a variable was missing here (#798 was the second); the gate in
      # `test_config_env_reaches_the_container.py` now covers EVERY environment setting.
      TENANT_HOSTNAMES: ${TENANT_HOSTNAMES:-}
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
      SEED_ADMIN_EMAILS: ${SEED_ADMIN_EMAILS:-}
      SEED_FINANCE_EMAILS: ${SEED_FINANCE_EMAILS:-}
      SEED_OPERATOR_EMAILS: ${SEED_OPERATOR_EMAILS:-}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      MEMBERSHIP_RENEWAL_START_MD: ${MEMBERSHIP_RENEWAL_START_MD:-}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-}
      PAYMENT_BENEFICIARY: ${PAYMENT_BENEFICIARY:-}
      PAYMENT_TERM_DAYS: ${PAYMENT_TERM_DAYS:-7}
    volumes:
      # #766: the application log outlives the container. `up --build` creates a new
      # container and container logs belong to the container, so everything the app had
      # ever reported was gone after every deploy. A named volume stays; its owner comes
      # from the image (see backend/Dockerfile).
      - backend_prod_logs:/var/log/raak
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - prod-backend


  # Umami (#176) — via subdomein door de gedeelde Caddy (alias prod-umami), eigen DB.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/umami_prod}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET ontbreekt in .env.prod}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - prod-umami

  db-backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt in .env.prod}
      DB_USER: ${DB_USER:?DB_USER ontbreekt in .env.prod}
      DB_NAME: raakmillegem
      BACKUP_PREFIX: prod
      KEEP_DAYS: 7
      BACKUP_HOUR: "02"
    volumes:
      - ./backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["bash", "/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Aparte dagelijkse back-up van de Umami-analytics-DB (#176).
  umami-db-backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt in .env.prod}
      DB_USER: ${DB_USER:?DB_USER ontbreekt in .env.prod}
      DB_NAME: umami_prod
      BACKUP_PREFIX: prod-umami
      KEEP_DAYS: 7
      BACKUP_HOUR: "03"
    volumes:
      - ./backups:/backups
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["bash", "/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  backend_prod_logs:
  postgres_prod_data:

networks:
  internal:
  proxy:
    external: true
    name: raak_proxy
