name: hdev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: raakmillegem_hdev
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_hdev_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-onbekend}
        GIT_SHA: ${GIT_SHA:-onbekend}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/raakmillegem_hdev
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-false}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # STT/Voxtral (#282) — backend leest dit als runtime-env; default browser_only
      # houdt de WS-route dark. Zet STT_MODE=native_first in .env.hdev om Voxtral te activeren.
      STT_MODE: ${STT_MODE:-browser_only}
      STT_PROVIDER: ${STT_PROVIDER:-voxtral}
      STT_MODEL: ${STT_MODEL:-voxtral-mini-transcribe-realtime-2602}
      STT_BASE_URL: ${STT_BASE_URL:-wss://api.mistral.ai}
      STT_SAMPLE_RATE: ${STT_SAMPLE_RATE:-16000}
      STT_LANGUAGE: ${STT_LANGUAGE:-nl}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-auto}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_MAX_INPUT_CHARS: ${CHAT_MAX_INPUT_CHARS:-2000}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL ontbreekt in .env.hdev}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL ontbreekt in .env.hdev}
      APP_ENV: hdev
      # Rol-seeds voor de migraties (#798). Deze staan hier omdat de backend-service
      # GEEN `env_file:` heeft: elke variabele wordt expliciet doorgegeven, en wat
      # hier niet staat bereikt de container nooit — hoe netjes het ook in .env.hdev
      # staat. Gemeten bij de upgrade-generale voor v2.0.0: migratie 087 las haar
      # placeholder, vond niemand met dat adres, en kende NUL gebruikers de rol
      # OPERATOR toe, terwijl het juiste adres wel degelijk in .env.uat stond en als
      # gebruiker bestond. Gevolg: /admin/tenants was voor niemand bereikbaar.
      # Multi-tenancy (#406/#821). Deze twee horen hier omdat de backend-service
      # GEEN `env_file:` heeft: wat niet in dit blok staat, bereikt de container
      # nooit — hoe netjes het ook in .env.hdev staat. Gemeten op PROD:
      # `PLATFORM_HOSTS=[]` en `TENANT_HOSTNAMES=[]` in de draaiende backend,
      # terwijl beide in het env-bestand stonden.
      #
      # Het gevolg was niet alleen een ontbrekende landing: `resolve_request` leest
      # de tenant-cookie ALLEEN op een platform-host. Met een lege set werd die
      # cookie wel gezet en nooit gelezen, dus wie via een pad-prefix op een
      # afdeling binnenkwam en daarna een absoluut pad volgde, stond zonder
      # waarschuwing bij de standaard-tenant — met een inschrijfformulier voor de
      # verkeerde afdeling.
      #
      # Derde keer dat een variabele hier ontbrak (#798 was de tweede); de gate in
      # `test_config_env_bereikt_de_container.py` dekt nu élke omgevingsinstelling.
      TENANT_HOSTNAMES: ${TENANT_HOSTNAMES:-}
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
      SEED_ADMIN_EMAILS: ${SEED_ADMIN_EMAILS:-}
      SEED_FINANCE_EMAILS: ${SEED_FINANCE_EMAILS:-}
      SEED_OPERATOR_EMAILS: ${SEED_OPERATOR_EMAILS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEMBERSHIP_RENEWAL_START_MD: ${MEMBERSHIP_RENEWAL_START_MD:-}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-}
      PAYMENT_BENEFICIARY: ${PAYMENT_BENEFICIARY:-}
      PAYMENT_TERM_DAYS: ${PAYMENT_TERM_DAYS:-7}
    volumes:
      # #766: het applicatielog overleeft de container. `up --build` maakt een
      # nieuwe container en containerlogs horen bij de container, dus alles wat de
      # app ooit gemeld heeft was na elke deploy weg. Een named volume blijft; de
      # eigenaar komt uit het image (zie backend/Dockerfile).
      - backend_hdev_logs:/var/log/raak
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal


  # GEEN umami-service op HDEV (#820). Ze stond hier tot 10 september 2026 en heeft
  # sinds 13 juli van dat jaar niets meer geregistreerd — precies de dag waarop HDEV
  # server-rendered werd. Het trackingscript verdween bij de React-exit en is met
  # #808 alleen teruggekomen voor omgevingen mét tenant-instellingen; HDEV heeft die
  # bewust niet, zodat testverkeer nooit in de productiecijfers kan belanden. Er werd
  # dus niet alleen niets gemeten, er zál ook niets gemeten worden — voor 156 MiB
  # geheugen. UAT en PROD houden elk hun eigen instance; dit is geen consolidatie
  # (die is met #259 afgewezen).

  caddy:
    # Vastgepind (was `caddy:2`, een bewegende tag): een recreate mag nooit
    # ongemerkt een andere Caddy-versie binnenhalen. Upgraden doe je hier,
    # bewust, en eerst op HDEV.
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./caddy/Caddyfile.hdev:/etc/caddy/Caddyfile:z
      - caddy_hdev_data:/data
      - caddy_hdev_config:/config
    depends_on:
      - backend
    networks:
      - internal

volumes:
  backend_hdev_logs:
  postgres_hdev_data:
  caddy_hdev_data:
  caddy_hdev_config:

networks:
  internal:
