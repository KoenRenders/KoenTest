# Gedeelde Caddy reverse proxy voor alle omgevingen (UAT, PROD, ...).
# Draait apart van de stacks en verbindt via het externe netwerk 'raak_proxy'.
#
# Eenmalig aanmaken vóór de eerste start:
#   docker network create raak_proxy
#
# Starten:
#   docker compose -f docker-compose.caddy.yml up -d
#
# Config toepassen na een wijziging: ./deploy-caddy.sh
# NIET `caddy reload` gebruiken — die admin-API-reload is in-memory en overleeft
# geen herstart (#312/#314). deploy-caddy.sh doet een force-recreate, valideert
# de config vooraf en rolt terug als de PROD-rooktest faalt.

name: caddy

services:
  caddy:
    # Vastgepind (was `caddy:2`, een bewegende tag): een recreate mag nooit
    # ongemerkt een andere Caddy-versie binnenhalen. Upgraden doe je hier,
    # bewust, en eerst op HDEV.
    image: caddy:2.11.4
    restart: unless-stopped
    env_file:
      - .env.caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.shared:/etc/caddy/Caddyfile:z
      - caddy_shared_data:/data
      - caddy_shared_config:/config
    networks:
      - proxy

volumes:
  caddy_shared_data:
  caddy_shared_config:

networks:
  proxy:
    external: true
    name: raak_proxy
