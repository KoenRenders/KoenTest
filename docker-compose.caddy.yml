# Gedeelde Caddy reverse proxy voor alle omgevingen (UAT, PROD, ...).
# Draait apart van de stacks en verbindt via het externe netwerk 'raak_proxy'.
#
# Eenmalig aanmaken vóór de eerste start:
#   docker network create raak_proxy
#
# Starten:
#   docker compose -f docker-compose.caddy.yml up -d
#
# Config toepassen na een wijziging: ./deploy-caddy.sh
# NIET `caddy reload` gebruiken — die admin-API-reload is in-memory en overleeft
# geen herstart (#312/#314). deploy-caddy.sh doet een force-recreate, valideert
# de config vooraf en rolt terug als de PROD-rooktest faalt.

name: caddy

services:
  caddy:
    # Vastgepind (was `caddy:2`, een bewegende tag): een recreate mag nooit
    # ongemerkt een andere Caddy-versie binnenhalen. Upgraden doe je hier,
    # bewust, en eerst op HDEV.
    #
    # Via CADDY_IMAGE overschrijfbaar, zodat deploy-caddy.sh bij een gefaalde
    # rooktest kan terugvallen op de image-digest die vóór de deploy draaide
    # (een config-rollback helpt niet als de Caddy-VERSIE de storing is).
    image: ${CADDY_IMAGE:-caddy:2.11.4}
    restart: unless-stopped
    env_file:
      - .env.caddy
    environment:
      # #866: de platformdomeinen komen uit PLATFORM_HOSTS van .env.uat/.env.prod,
      # afgeleid door caddy/platform-domains.sh. Eén bewaarplaats voor "dit domein
      # is het platform", zodat proxy en app niet uit elkaar kunnen lopen.
      #
      # De `:?`-vorm laat compose falen als de afleiding niet gedraaid heeft. Dat is
      # met opzet: een lege waarde geeft een leeg siteadres, en dat maakt de config
      # voor ALLE sites ongeldig — dan start de proxy niet en ligt PROD plat.
      PLATFORM_UAT_DOMAIN: ${PLATFORM_UAT_DOMAIN:?PLATFORM_UAT_DOMAIN ontbreekt — draai deploy-caddy.sh, dat leidt het af uit .env.uat (#866)}
      PLATFORM_PROD_DOMAIN: ${PLATFORM_PROD_DOMAIN:?PLATFORM_PROD_DOMAIN ontbreekt — draai deploy-caddy.sh, dat leidt het af uit .env.prod (#866)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.shared:/etc/caddy/Caddyfile:z
      # De config is opgesplitst per omgeving (zie Caddyfile.shared); de delen
      # worden bij een deploy elk uit hun eigen release-tag geschreven.
      - ./caddy/parts:/etc/caddy/parts:z
      - caddy_shared_data:/data
      - caddy_shared_config:/config
    networks:
      - proxy

volumes:
  caddy_shared_data:
  caddy_shared_config:

networks:
  proxy:
    external: true
    name: raak_proxy
